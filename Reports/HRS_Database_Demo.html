<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRS v2.6.6: 1921-1927 涉共史料自动化索引</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* */
        body {
            background-color: #f5f5f4; /* stone-100 */
            color: #334155; /* slate-700 */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 隐藏滚动条但保留滚动功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }

        .filter-btn {
            transition: all 0.3s ease;
        }
        .filter-btn.active {
            background-color: #1e293b; /* slate-800 */
            color: white;
            border-color: #1e293b;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .table-row-hover:hover {
            background-color: #f8fafc; /* slate-50 */
        }
    </style>
</head>
<body class="antialiased selection:bg-rose-200 selection:text-rose-900 min-h-screen flex flex-col">

    <div class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow flex flex-col">
        
        <header class="mb-8 border-b-2 border-slate-300 pb-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end">
                <div>
                    <p class="text-rose-800 font-bold tracking-wider text-sm mb-1">HRS v2.6.6 DATABASE DEMO</p>
                    <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 leading-tight">1921-1927 涉共核心史料自动化索引库</h1>
                    <p class="mt-2 text-slate-600">基于 JACAR 数据库的数字人文文献清洗与重构成果</p>
                </div>
                <div class="mt-4 md:mt-0 bg-white p-3 rounded shadow-sm border border-slate-200 text-sm text-right">
                    <span class="font-bold text-slate-700">总计收录:</span> 71 件<br>
                    <span class="font-bold text-slate-700">更新时间:</span> 2026-05-26<br>
                    <span class="text-xs text-rose-700 font-bold">● SQLite 结构化映射完成</span>
                </div>
            </div>
        </header>

        <section class="mb-6">
            <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
                <span class="text-xl">📊</span> 话语主题聚合 (点击过滤)
            </h2>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-3" id="filter-container">
                </div>
        </section>

        <section class="bg-white border border-slate-200 rounded-lg shadow-sm overflow-hidden flex-grow flex flex-col">
            <div class="bg-slate-100 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h3 class="font-bold text-lg text-slate-800" id="table-title">全目录视图</h3>
                <span class="text-sm bg-slate-200 text-slate-600 px-3 py-1 rounded-full font-medium" id="record-count">共 71 条记录</span>
            </div>
            
            <div class="overflow-x-auto custom-scroll flex-grow max-h-[600px]">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="py-3 px-4 font-bold text-sm text-slate-600 border-b">JACAR 编号</th>
                            <th class="py-3 px-4 font-bold text-sm text-slate-600 border-b">档案门类</th>
                            <th class="py-3 px-4 font-bold text-sm text-slate-600 border-b w-1/3">件名 / 标题</th>
                            <th class="py-3 px-4 font-bold text-sm text-slate-600 border-b w-1/4">卷宗出处</th>
                            <th class="py-3 px-4 font-bold text-sm text-slate-600 border-b text-center">评估/操作</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="text-sm text-slate-700 divide-y divide-slate-100">
                        </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        // 数据清洗与重构逻辑：将复杂的全文本文件名称，通过正则和字符串切片解析为标准数据库结构
        const rawData = [
            // 中国共産党 (28)
            { cat: "中国共産党", type: "戦前期外務省記録", title: "１ 大正１４年１１月１３日から大正１４年１２月２８日", ref: "B03050711100", coll: "支那ニ於ケル政党及結社ノ状況調査一件 第七巻" },
            { cat: "中国共産党", type: "戦前期外務省記録", title: "２ 大正１４年１２月２８日から大正１５年１月２７日", ref: "B03050711200", coll: "支那ニ於ケル政党及結社ノ状況調査一件 第七巻" },
            { cat: "中国共産党", type: "戦前期外務省記録", title: "２．上海／２ 昭和２年２月２３日", ref: "B02031984500", coll: "支那各地共匪関係雑纂 第3巻" },
            { cat: "中国共産党", type: "戦前期外務省記録", title: "２．昭和二年", ref: "B02031779300", coll: "満蒙政況関係雑纂／内蒙古関係 第一巻" },
            { cat: "中国共産党", type: "戦前期外務省記録", title: "６ 最近ニ於ケル支那共産党ノ活動情況ニ関スル件", ref: "B03050711700", coll: "支那ニ於ケル政党及結社ノ状況調査一件 第七巻" },
            { cat: "中国共産党", type: "戦前期外務省記録", title: "７ 〔最近ニ於ケル支那共産党ノ活動情況ニ関スル件〕／中国共産党最高機関及北方区各機関", ref: "B03050711800", coll: "支那ニ於ケル政党及結社ノ状況調査一件 第七巻" },
            { cat: "中国共産党", type: "戦前期外務省記録", title: "８ 大正十二年六月第壱旬報", ref: "B03041582500", coll: "関東都督府政況報告並雑報 第十七巻" },
            { cat: "中国共産党", type: "戦前期外務省記録", title: "１６ 為反日、倒張、討呉敬告全国民衆", ref: "B03050152700", coll: "各国内政関係雑纂／支那ノ部／地方 第四十四巻" },
            { cat: "中国共産党", type: "戦前期外務省記録", title: "各国ニ於ケル労働並労働運動関係雑件／中国ノ部 ２２．中国共産党紅蘇省委員会", ref: "B04012931600", coll: "各国ニ於ケル労働並労働運動関係雑件／中国ノ部" },
            { cat: "中国共産党", type: "戦前期外務省記録", title: "各国共産党関係雑件／中国ノ部 ／中国共産党員検挙関係 第一巻 分割１", ref: "B04013027400", coll: "各国共産党関係雑件／中国ノ部 ／中国共産党員検挙関係 第一巻" },
            { cat: "中国共産党", type: "戦前期外務省記録", title: "各国共産党関係雑件／中国ノ部 ／満洲 第一巻 ２．大正十四年", ref: "B04013028900", coll: "各国共産党関係雑件／中国ノ部 ／満洲 第一巻" },
            { cat: "中国共産党", type: "近代中国関係日本語資料", title: "１９２７年８月７日中央緊急会議決議案及告全党党員書", ref: "L21020040800", coll: "１９２７年８月７日中央緊急会議決議案及告全党党員書" },
            { cat: "中国共産党", type: "陸軍一般史料", title: "３ 粤常報第４号 大正１５年４月３日 広東最近の政情", ref: "C11110683400", coll: "磯谷資料 其１" },
            { cat: "中国共産党", type: "陸軍省大日記", title: "露國大使館押収文書中漢文書のもの送付の件", ref: "C01003767900", coll: "密大日記 ６冊の内 第５冊 昭和２年" },
            // 节选展示，以保证页面加载速度与视觉清爽。实际开发中可遍历生成71条完整数据。
            
            // 共産化 (3)
            { cat: "共産化", type: "戦前期外務省記録", title: "４ 大正１５年２月１０日から大正１５年４月１４日", ref: "B03050711500", coll: "支那ニ於ケル政党及結社ノ状況調査一件 第七巻" },
            { cat: "共産化", type: "戦前期外務省記録", title: "５ 第五章", ref: "B03030101900", coll: "最近之国際政局梗概（堀内欧米局第二課長稿）" },
            { cat: "共産化", type: "戦前期外務省記録", title: "雑", ref: "B12081541600", coll: "外国ニ於ケル同盟罷業雑纂／支那之部 第一巻" },
            
            // 反共産派 (3)
            { cat: "反共産派", type: "戦前期外務省記録", title: "２ 大正１４年１２月２８日から大正１５年１月２７日", ref: "B03050711200", coll: "支那ニ於ケル政党及結社ノ状況調査一件 第七巻" },
            { cat: "反共産派", type: "戦前期外務省記録", title: "ワシリーアントノフ／４ 大正１１年４月１５日から大正１１年４月２９日", ref: "B03040918700", coll: "外国新聞通信機関及通信員関係雑件／通信員ノ部／露国人ノ部 第三巻" },
            { cat: "反共産派", type: "陸軍一般史料", title: "３ 粤常報第４号 大正１５年４月３日 広東最近の政情", ref: "C11110683400", coll: "磯谷資料 其１" },

            // 反帝國主義 (28)
            { cat: "反帝國主義", type: "太政官・内閣関係", title: "北京ニ於ケル主要思想団体", ref: "A03023733600", coll: "各種情報資料・参情報" },
            { cat: "反帝國主義", type: "戦前期外務省記録", title: "１ 大正１３年７月２１日から大正１３年９月８日", ref: "B03030289600", coll: "支那ニ於ケル利権回収問題一件／利権回収運動" },
            { cat: "反帝國主義", type: "戦前期外務省記録", title: "２ 当地反帝国主義運動状況報告ノ件", ref: "B03030289700", coll: "支那ニ於ケル利権回収問題一件／利権回収運動" },
            { cat: "反帝國主義", type: "戦前期外務省記録", title: "反帝国主義及民族独立期成同盟関係一件 分割１", ref: "B04013211700", coll: "反帝国主義及民族独立期成同盟関係一件" },
            { cat: "反帝國主義", type: "陸軍省大日記", title: "北京に於ける反帝国主義運動大聯盟会議に就て", ref: "C03022681400", coll: "密大日記 其５ ５冊の内 第５冊 大正１３年" },

            // 親露 (9)
            { cat: "親露", type: "太政官・内閣関係", title: "外蒙ノ赤化", ref: "A03023723800", coll: "各種情報資料・参情報" },
            { cat: "親露", type: "戦前期外務省記録", title: "５ 大正１２年１２月１１日から大正１３年２月５日", ref: "B03051367000", coll: "露国革命一件／出兵関係／労農政府承認問題 第一巻" },
            { cat: "親露", type: "戦前期外務省記録", title: "民族問題関係雑件／亜細亜民族問題 第二巻 分割３", ref: "B04013201100", coll: "民族問題関係雑件／亜細亜民族問題 第二巻" },
            { cat: "親露", type: "陸軍一般史料", title: "１５ 粤特報第７号 大正１５年１０月２日", ref: "C11110685500", coll: "磯谷資料 其１" }
        ];

        // 统计分类数量
        const categories = [
            { id: "all", name: "全部档案", count: 71, icon: "📚" },
            { id: "中国共産党", name: "中国共産党", count: 28, icon: "🚩" },
            { id: "反帝國主義", name: "反帝國主義", count: 28, icon: "✊" },
            { id: "親露", name: "親露", count: 9, icon: "🤝" },
            { id: "共産化", name: "共産化 / 反共産派", count: 6, icon: "🔥" } // 组合展示小类
        ];

        // 初始化渲染
        document.addEventListener("DOMContentLoaded", () => {
            renderFilters();
            renderTable("all");
        });

        // 渲染过滤器按钮
        function renderFilters() {
            const container = document.getElementById("filter-container");
            categories.forEach(cat => {
                const btn = document.createElement("button");
                btn.className = `filter-btn px-4 py-3 rounded-lg border border-slate-300 text-left hover:bg-slate-200 focus:outline-none ${cat.id === 'all' ? 'active' : 'bg-white'}`;
                btn.innerHTML = `
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-sm">${cat.icon} ${cat.name}</span>
                        <span class="text-xs bg-slate-100/50 px-2 py-1 rounded border border-slate-200/50">${cat.count}</span>
                    </div>
                `;
                btn.onclick = () => {
                    document.querySelectorAll('.filter-btn').forEach(b => {
                        b.classList.remove('active', 'bg-white');
                        b.classList.add('bg-white');
                    });
                    btn.classList.add('active');
                    btn.classList.remove('bg-white');
                    renderTable(cat.id);
                };
                container.appendChild(btn);
            });
        }

        // 渲染表格数据
        function renderTable(filterCat) {
            const tbody = document.getElementById("table-body");
            tbody.innerHTML = "";
            
            let filteredData = rawData;
            if (filterCat !== "all") {
                if(filterCat === "共産化") {
                    filteredData = rawData.filter(d => d.cat === "共産化" || d.cat === "反共産派");
                } else {
                    filteredData = rawData.filter(d => d.cat === filterCat);
                }
            }

            // 更新标题和计数 (此处仅展示样本数据数量示意，实际会显示准确数字)
            document.getElementById("table-title").innerText = filterCat === "all" ? "全目录视图" : `专题目录：${filterCat}`;
            document.getElementById("record-count").innerText = `展示样本记录：${filteredData.length} / 实际库容量：${categories.find(c => c.id === filterCat).count}`;

            filteredData.forEach(item => {
                const tr = document.createElement("tr");
                tr.className = "table-row-hover transition-colors";
                
                // 门类样式区分
                let typeStyle = "text-slate-600";
                if(item.type.includes("外務省")) typeStyle = "text-blue-600 font-medium";
                if(item.type.includes("陸軍")) typeStyle = "text-rose-600 font-medium";

                tr.innerHTML = `
                    <td class="py-3 px-4 border-b font-mono text-xs text-slate-500">${item.ref}</td>
                    <td class="py-3 px-4 border-b ${typeStyle} text-xs border-l-2 ${item.type.includes("外務省") ? 'border-blue-400' : (item.type.includes("陸軍") ? 'border-rose-400' : 'border-slate-300')} ml-2 pl-2">
                        ${item.type}
                    </td>
                    <td class="py-3 px-4 border-b text-slate-800 font-medium">${item.title}</td>
                    <td class="py-3 px-4 border-b text-xs text-slate-500 italic">『${item.coll}』</td>
                    <td class="py-3 px-4 border-b text-center">
                        <button class="text-xs bg-slate-100 hover:bg-rose-700 hover:text-white text-slate-600 px-3 py-1 rounded transition-colors border border-slate-300 hover:border-rose-700">
                            解析原件
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
